<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Task:5</h1>
    <button id="taskes" style="border: 1px solid black;margin:10px;padding: 10px;">Cancel</button> 
    <script>
    const a=document.getElementById("taskes")
    
    const d=setTimeout(() => {
        alert("Displayed after 10 seconds")
    },10000);
    a.addEventListener("click",(e)=>{
        clearTimeout(d);
    })

    </script>
</body>
</html>
