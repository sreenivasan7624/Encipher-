<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="head" style="border: 3px solid black;padding: 10px;background-color: blue;display: inline;">Task:7</h1>

    <script>
    //task 7
    const hea=document.getElementById("head");
    hea.addEventListener('mouseenter',function(e){
        hea.style.backgroundColor="red"
    })
    hea.addEventListener('mouseleave',function(e){
        hea.style.backgroundColor="pink"
    })
    </script>
</body>
</html>
