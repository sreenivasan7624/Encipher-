<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="len" style="width: 200px;height: 200px;justify-content: center;text-align: center;align-items: center;">Task:10</h1>
    <script>
        const a=document.getElementById("len")
        a.addEventListener('mousemove',function(e){
            let x=e.clientX;
            let y=e.clientY;
            a.style.backgroundColor=`rgb(${x},${y},200)`;
        })
    </script>
</body>
</html>
