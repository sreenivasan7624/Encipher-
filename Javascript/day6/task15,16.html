<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" id="for">
        <input type="text" id="in">
        <button>Submit</button>
    </form>
</body>
<script>
    const a=document.getElementById("for");
    const input=document.getElementById("in")
    a.addEventListener("submit",function(e){
        if(input.value.trim()==""){
            alert("It cannot be submitted")
        }
        else{
        e.preventDefault();
        alert("Submitted without reload");
        }
    })
</script>
</html>
